spring:
  datasource:
    url: jdbc:h2:mem:tracker;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

app:
  github:
    base-url: http://localhost:0
    token: ""
    max-attempts: 2
    initial-backoff: PT0.01S
    connect-timeout: PT1S
    read-timeout: PT2S
  poll:
    # Планировщик в тестах фактически отключён: обход запускается вручную через runOnce().
    tick: PT1H
    min-interval: PT0S
    batch-size: 50
    failure-limit: 3

logging:
  level:
    liquibase: WARN
